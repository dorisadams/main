server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ── Security headers ────────────────────────────────────────────────────────

  # Prevent MIME-type sniffing
  add_header X-Content-Type-Options "nosniff" always;

  # Don't send the referrer to cross-origin pages
  add_header Referrer-Policy "no-referrer" always;

  # Forbid framing from other origins (clickjacking defence)
  add_header X-Frame-Options DENY always;

  # Restrict cross-origin resource sharing at the browser level
  add_header Cross-Origin-Resource-Policy "same-site" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  # SharedArrayBuffer (required by bb.js / Barretenberg WASM threads) needs
  # cross-origin isolation.  The two headers above enable that isolation.
  add_header Cross-Origin-Embedder-Policy "require-corp" always;

  # Content-Security-Policy is applied always (on every response, including
  # errors); the add_header below carries the policy.  This file is consumed
  # This file is consumed by the frontend Docker image; the two origin
  # placeholders below are filled in at container start with `envsubst`
  # from the VITE_API_BASE / VITE_STELLAR_RPC_URL environment variables so
  # the header always matches the bundle's compiled-in origins.
  #
  # - default-src 'self'               only same-origin resources by default
  # - script-src  'self' 'strict-dynamic' 'wasm-unsafe-eval'
  #                                    nonce-patched entry-point at build time;
  #                                    strict-dynamic lets Vite chunks load;
  #                                    wasm-unsafe-eval is required by bb.js
  # - worker-src  blob:                Barretenberg spawns WASM workers via blob URLs
  # - connect-src 'self' + backend API + Stellar RPC (no wildcards)
  # - style-src   'self' 'unsafe-inline'  React injects inline styles
  # - img-src     'self' data:          SVG / data URIs used in the UI
  # - frame-ancestors 'none'           belt-and-suspenders framing block
  #
  # Keep this policy aligned with src/csp.ts (buildCsp/validateCsp); the
  # csp.test.ts snapshot suite fails on drift.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'strict-dynamic' 'wasm-unsafe-eval' 'nonce-$CSP_NONCE'; worker-src 'self' blob:; child-src 'self' blob:; connect-src 'self' $VITE_API_BASE $VITE_STELLAR_RPC_URL; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'none';" always;

  # ── Static asset caching ────────────────────────────────────────────────────

  location ~* \.wasm$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Content-Type "application/wasm";
    # Repeat security headers — nginx add_header only inherits into a block
    # when no other add_header appears in the same block, so we must repeat.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'strict-dynamic' 'wasm-unsafe-eval' 'nonce-$CSP_NONCE'; worker-src 'self' blob:; child-src 'self' blob:; connect-src 'self' $VITE_API_BASE $VITE_STELLAR_RPC_URL; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'none';" always;
    try_files $uri =404;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|json)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'strict-dynamic' 'wasm-unsafe-eval' 'nonce-$CSP_NONCE'; worker-src 'self' blob:; child-src 'self' blob:; connect-src 'self' $VITE_API_BASE $VITE_STELLAR_RPC_URL; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'none';" always;
    try_files $uri =404;
  }

  # ── SPA fallback ─────────────────────────────────────────────────────────────

  location / {
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'strict-dynamic' 'wasm-unsafe-eval' 'nonce-$CSP_NONCE'; worker-src 'self' blob:; child-src 'self' blob:; connect-src 'self' $VITE_API_BASE $VITE_STELLAR_RPC_URL; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'none';" always;
    try_files $uri $uri/ /index.html;
  }
}
